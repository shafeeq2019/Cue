[package]
name = "cue-core"
description = "Provider, auth and settings core for the Cue desktop assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
keyring = { version = "4.2.0", optional = true }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "form", "query", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[features]
keyring = ["dep:keyring"]

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full"] }
wiremock = "0.6.5"
